[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-autosservico-bff"
version = "1.0.0"
description = "Microsserviço BFF (Backend For Frontend) do autosserviço da SME"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "SME" }]
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

[tool.black]
line-length = 79
target-version = ["py312"]
extend-exclude = "/migrations/"

[tool.ruff]
target-version = "py312"
line-length = 79
extend-exclude = [
    "*/migrations/*",
    "staticfiles/",
    "docs/",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "D",   # pydocstyle (PEP 257)
    "S",   # flake8-bandit
    "DJ",  # flake8-django
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
]
ignore = [
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    "RUF012", # mutable class attrs are the standard DRF views/serializers idiom
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["D", "RUF012"]
"config/settings.py" = ["D100", "E501"]
"**/tests/**" = ["S101", "D100", "D101", "D102", "D103"]
"**/__init__.py" = ["D104"]
"conftest.py" = ["D100"]
"apps/*/conftest.py" = ["D100"]

"apps/zabbix/api/serializers.py" = ["N815"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "*.tests.*"
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
minversion = "6.0"
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
plugins = ["django_coverage_plugin"]

[tool.coverage.report]
show_missing = true
fail_under = 80
