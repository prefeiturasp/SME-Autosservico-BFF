services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sme_autosservico_bff
    command: >
      sh -c "
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      - keydb

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sme_autosservico_bff_worker
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - keydb

  keydb:
    image: eqalpha/keydb:latest
    container_name: sme_autosservico_bff_keydb
    ports:
      - "6379:6379"
    volumes:
      - keydb_data:/data

volumes:
  static_volume:
  keydb_data:
